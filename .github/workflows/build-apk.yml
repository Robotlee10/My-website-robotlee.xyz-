name: Build Android APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.1
        
      - name: Set Up Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Temporary App Directory
        run: |
          mkdir temp_www
          cp *.html temp_www/ 2>/dev/null || true
          cp *.css temp_www/ 2>/dev/null || true
          cp *.js temp_www/ 2>/dev/null || true
          cp *.png temp_www/ 2>/dev/null || true

      - name: Install Android Shell Environment
        run: |
          npm install
          npx cap add android
          npx cap sync

      - name: Generate App Icons from Favicon
        run: |
          if [ -f "favicon.png" ]; then
            echo "favicon.png found! Cleaning defaults and generating new launcher icons..."
            
            sudo apt-get update && sudo apt-get install -y imagemagick
            
            RES_DIR="android/app/src/main/res"
            
            # CRITICAL FIX: Delete the default adaptive vector files that block custom PNG icons
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher.xml
            rm -f $RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml
            
            # Resize and overwrite standard icon sets
            convert favicon.png -resize 48x48     $RES_DIR/mipmap-mdpi/ic_launcher.png
            convert favicon.png -resize 72x72     $RES_DIR/mipmap-hdpi/ic_launcher.png
            convert favicon.png -resize 96x96     $RES_DIR/mipmap-xhdpi/ic_launcher.png
            convert favicon.png -resize 144x144   $RES_DIR/mipmap-xxhdpi/ic_launcher.png
            convert favicon.png -resize 192x192   $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
            
            # Resize and overwrite round icon sets
            convert favicon.png -resize 48x48     $RES_DIR/mipmap-mdpi/ic_launcher_round.png
            convert favicon.png -resize 72x72     $RES_DIR/mipmap-hdpi/ic_launcher_round.png
            convert favicon.png -resize 96x96     $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
            convert favicon.png -resize 144x144   $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
            convert favicon.png -resize 192x192   $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png
          else
            echo "favicon.png not found. Falling back to default Capacitor icon."
          fi
          
      - name: Compile Mobile App Binary
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Deliver Completed APK Download
        uses: actions/upload-artifact@v4
        with:
          name: compiled-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
