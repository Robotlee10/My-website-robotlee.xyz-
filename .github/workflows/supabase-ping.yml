name: Keep Supabase Awake
on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch: # Allows manual triggers

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Auto-Detect and Ping Supabase
        run: |
          # 1. Search all .html files for unique Supabase URLs
          URLS=$(grep -oE 'https://[a-zA-Z0-9.-]+\.supabase\.co' *.html 2>/dev/null | cut -d: -f2- | sort -u)

          # 2. Loop through each URL found and ping it
          if [ -n "$URLS" ]; then
            echo "Found the following Supabase URLs:"
            echo "$URLS"
            
            for URL in $URLS; do
              echo "Pinging: $URL"
              curl -s -I "$URL/rest/v1/" > /dev/null
            done
            echo "Successfully pinged all Supabase instances!"
          else
            echo "No Supabase URLs found across HTML files."
          fi
